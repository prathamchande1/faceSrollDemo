<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Touch Distortion</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow-x: hidden;
        }

        .section {
            position: relative;
        }

        .banner {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div class="section">
        <div class="banner"></div>
    </div>

    <script>
        const banner = document.querySelector( '.banner' );

        // -----------------------------
        // IMAGE LIST (27 → 37)
        // -----------------------------
        const images = [];
        for ( let i = 27; i <= 37; i++ ) {
            let num = i.toString().padStart( 3, '0' );
            images.push( `poke_${num}.png` );
        }

        // -----------------------------
        // IMAGE ELEMENT
        // -----------------------------
        const img = document.createElement( 'img' );
        img.src = images[0]; // ✅ default image

        Object.assign( img.style, {
            width: "100%",
            height: "100%",
            objectFit: "cover"
        } );

        banner.appendChild( img );

        // -----------------------------
        // GRID (CHEEK AREA)
        // -----------------------------
        function getZone( x, y ) {
            const rect = banner.getBoundingClientRect();

            const px = x - rect.left;
            const py = y - rect.top;

            const w = rect.width;
            const h = rect.height;

            const startX = w * 0.52;
            const startY = h * 0.38;

            const cols = 3;
            const rows = 4;

            const zoneW = w * 0.11;
            const zoneH = h * 0.09;

            const col = Math.floor( ( px - startX ) / zoneW );
            const row = Math.floor( ( py - startY ) / zoneH );

            if ( col < 0 || col >= cols || row < 0 || row >= rows ) return -1;

            const index = row * cols + col;
            if ( index >= images.length ) return -1;

            return index;
        }

        // -----------------------------
        // STATE
        // -----------------------------
        let isDown = false;
        let lastZone = -1;

        // -----------------------------
        // UPDATE IMAGE
        // -----------------------------
        function updateImage( x, y ) {
            const zone = getZone( x, y );

            // only update when zone actually changes (smooth + avoids flicker)
            if ( zone !== -1 && zone !== lastZone ) {
                lastZone = zone;
                img.src = images[zone];
            }
        }

        // -----------------------------
        // RESET TO DEFAULT
        // -----------------------------
        function resetImage() {
            lastZone = -1;
            img.src = images[0]; // ✅ back to default
        }

        // -----------------------------
        // MOUSE EVENTS
        // -----------------------------
        banner.addEventListener( 'mousedown', ( e ) => {
            isDown = true;
            updateImage( e.clientX, e.clientY ); // instant response
        } );

        window.addEventListener( 'mouseup', () => {
            isDown = false;
            resetImage(); // ✅ reset on release
        } );

        window.addEventListener( 'mousemove', ( e ) => {
            if ( !isDown ) return;
            updateImage( e.clientX, e.clientY );
        } );

        // -----------------------------
        // TOUCH EVENTS
        // -----------------------------
        banner.addEventListener( 'touchstart', ( e ) => {
            isDown = true;
            const t = e.touches[0];
            updateImage( t.clientX, t.clientY );
        } );

        window.addEventListener( 'touchend', () => {
            isDown = false;
            resetImage(); // ✅ reset on release
        } );

        window.addEventListener( 'touchmove', ( e ) => {
            if ( !isDown ) return;

            const t = e.touches[0];
            updateImage( t.clientX, t.clientY );
        } );
    </script>
</body>

</html>
