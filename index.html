<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Scroll Banner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow-x:hidden;
    background:#111;
}

/* section height auto by number of images */
.section{
    position:relative;
}

/* common banner style */
.banner{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    background-size:cover;
    background-position:center;
}
</style>
</head>

<body>

<div class="section">

    <!-- add unlimited banners -->
    <div class="banner" style="background-image:url('im1.jpeg')"></div>
    <div class="banner" style="background-image:url('im2.jpeg')"></div>
    <div class="banner" style="background-image:url('img1.jpeg')"></div>

</div>

<script>
const banners = document.querySelectorAll(".banner");
const section = document.querySelector(".section");

/* auto section height */
section.style.height = banners.length * 100 + "vh";
</script>

</body>
</html>
